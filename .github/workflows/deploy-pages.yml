name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [new-architecture]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PostHog project token
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
        run: test -n "$PUBLIC_POSTHOG_PROJECT_TOKEN" || { echo "Set the PUBLIC_POSTHOG_PROJECT_TOKEN repository Actions variable before deploying."; exit 1; }
      - name: Build, verify SEO and upload static site
        uses: withastro/action@v6
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
        with:
          node-version: 22
          build-cmd: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish generated website
        id: deployment
        uses: actions/deploy-pages@v5
